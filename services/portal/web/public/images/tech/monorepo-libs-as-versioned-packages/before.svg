<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="15">
  <rect width="480" height="290" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- 前 -->
  <text x="16" y="30" font-weight="bold" font-size="17" fill="#b91c1c">全部が 1 つの workspaces</text>
  <rect x="16" y="44" width="448" height="200" rx="10" fill="#fdf2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="68" fill="#7f1d1d" font-size="14">リポジトリ = npm workspaces</text>
  <rect x="36" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="96" y="109" text-anchor="middle" fill="#374151">サービス A</text>
  <rect x="180" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="240" y="109" text-anchor="middle" fill="#374151">サービス B</text>
  <rect x="324" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="384" y="109" text-anchor="middle" fill="#374151">サービス C</text>
  <line x1="96" y1="124" x2="200" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="124" x2="240" y2="176" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="384" y1="124" x2="280" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="96" y="180" width="288" height="44" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="240" y="207" text-anchor="middle" fill="#7c2d12" font-size="14">共通ライブラリ (ソースを直接参照)</text>
  <text x="240" y="268" text-anchor="middle" fill="#374151" font-size="14">ライブラリを変えると、全サービスが同時に変わる</text>
</svg>
