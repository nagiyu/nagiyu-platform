<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="15">
  <rect width="480" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="16" y="30" font-weight="bold" font-size="17" fill="#374151">作業ブランチは複数、動作確認用の環境は 1 つ</text>
  <rect x="16" y="50" width="136" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="84" y="78" text-anchor="middle" fill="#7c2d12">ライブラリの</text>
  <text x="84" y="100" text-anchor="middle" fill="#7c2d12">対応</text>
  <rect x="172" y="50" width="136" height="64" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="240" y="78" text-anchor="middle" fill="#374151">サービス A の</text>
  <text x="240" y="100" text-anchor="middle" fill="#374151">対応</text>
  <rect x="328" y="50" width="136" height="64" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="396" y="78" text-anchor="middle" fill="#374151">サービス B の</text>
  <text x="396" y="100" text-anchor="middle" fill="#374151">対応</text>
  <line x1="84" y1="114" x2="200" y2="196" stroke="#c2410c" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="240" y1="114" x2="240" y2="194" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="396" y1="114" x2="280" y2="196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="64" y="198" width="352" height="96" rx="10" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/>
  <text x="240" y="226" text-anchor="middle" font-weight="bold" fill="#374151">動作確認用の環境 (1 つだけ)</text>
  <text x="240" y="254" text-anchor="middle" fill="#374151" font-size="14">サービス A ・ サービス B ・ サービス C …</text>
  <text x="240" y="278" text-anchor="middle" fill="#374151" font-size="14">後からデプロイしたものが上書きする</text>
  <rect x="16" y="320" width="448" height="80" rx="8" fill="#fdf2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="240" y="350" text-anchor="middle" fill="#7f1d1d">ライブラリの対応は、全サービスをデプロイする</text>
  <text x="240" y="376" text-anchor="middle" fill="#7f1d1d">→ 終わるまで、ほかの対応は待つしかない</text>
</svg>
