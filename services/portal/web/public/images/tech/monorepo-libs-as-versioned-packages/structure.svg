<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="15">
  <rect width="480" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- 前 -->
  <text x="16" y="30" font-weight="bold" font-size="17" fill="#b91c1c">前: 全部が 1 つの workspaces</text>
  <rect x="16" y="44" width="448" height="200" rx="10" fill="#fdf2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="68" fill="#7f1d1d" font-size="14">リポジトリ = npm workspaces</text>
  <rect x="36" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="96" y="109" text-anchor="middle" fill="#374151">サービス A</text>
  <rect x="180" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="240" y="109" text-anchor="middle" fill="#374151">サービス B</text>
  <rect x="324" y="84" width="120" height="40" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="384" y="109" text-anchor="middle" fill="#374151">サービス C</text>
  <line x1="96" y1="124" x2="200" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="124" x2="240" y2="176" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="384" y1="124" x2="280" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="96" y="180" width="288" height="44" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="240" y="207" text-anchor="middle" fill="#7c2d12" font-size="14">共通ライブラリ (ソースを直接参照)</text>
  <text x="240" y="268" text-anchor="middle" fill="#374151" font-size="14">ライブラリを変えると、全サービスが同時に変わる</text>
  <!-- 後 -->
  <text x="16" y="316" font-weight="bold" font-size="17" fill="#15803d">後: ライブラリだけ外に出して公開</text>
  <rect x="16" y="330" width="448" height="160" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="354" fill="#14532d" font-size="14">同じリポジトリ</text>
  <rect x="36" y="368" width="200" height="104" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="136" y="390" text-anchor="middle" fill="#374151" font-size="14">npm workspaces</text>
  <text x="136" y="416" text-anchor="middle" fill="#374151">A: ui@0.1.1</text>
  <text x="136" y="440" text-anchor="middle" fill="#374151">B: ui@0.1.1</text>
  <text x="136" y="464" text-anchor="middle" fill="#374151">C: ui@0.1.0</text>
  <rect x="260" y="368" width="188" height="104" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="354" y="406" text-anchor="middle" fill="#7c2d12">共通ライブラリ</text>
  <text x="354" y="430" text-anchor="middle" fill="#7c2d12" font-size="13">(独立した npm プロジェクト)</text>
  <rect x="140" y="530" width="200" height="44" rx="6" fill="#eef2f7" stroke="#5b6b82" stroke-width="1.5"/>
  <text x="240" y="557" text-anchor="middle" fill="#374151">npmjs.com</text>
  <line x1="354" y1="472" x2="300" y2="528" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="348" y="510" fill="#374151" font-size="13">publish</text>
  <line x1="180" y1="528" x2="136" y2="474" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="510" fill="#374151" font-size="13">版を選んで取る</text>
</svg>
