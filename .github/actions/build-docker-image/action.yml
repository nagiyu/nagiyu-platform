name: Build Docker Image
description: public ECR へ認証したうえで Docker イメージをビルドする（build args 指定可）

inputs:
  dockerfile:
    description: Dockerfile path (e.g. services/stock-tracker/web/Dockerfile)
    required: true
  image-tag:
    description: Docker image tag to build
    required: true
  build-args:
    description: 'Build args as KEY=VALUE lines (e.g. APP_VERSION=1.0.0)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # 匿名 pull は送信元 IP 単位のクォータで、共有 IP の runner では他者に枠を消費されて
    # `Data limit exceeded` になる。認証するとクォータが認証済みアカウント単位になる。
    # IAM 権限の反映がデプロイタイミングにより遅れる環境でもビルドを止めないよう、
    # ログイン失敗は警告にとどめて匿名 pull で続行する。
    - name: Login to public ECR
      shell: bash
      run: |
        # ECR Public の認証トークンは us-east-1 でしか取得できない
        if ! aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws; then
          echo "::warning::public ECR へのログインに失敗したため、匿名 pull で続行します"
        fi

    - name: Build Docker image
      shell: bash
      env:
        DOCKER_BUILDKIT: 0
        DOCKER_BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        ./.github/scripts/docker-build-with-retry.sh \
          "${{ inputs.image-tag }}" \
          "${{ inputs.dockerfile }}"
