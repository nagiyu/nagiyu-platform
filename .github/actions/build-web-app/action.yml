name: Build Web App
description: Setup Node.js, install dependencies, build shared libs, shared workspaces and target web workspace

inputs:
  workspace:
    description: NPM workspace name to build (e.g. @nagiyu/admin)
    required: true
  shared-workspaces:
    description: Comma-separated non-lib workspaces (e.g. core packages) to build before target workspace
    required: false
    default: ''
  skip-setup-node:
    description: Set to 'true' to skip actions/setup-node and use the Node.js already in the runtime environment (e.g. a container image)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.skip-setup-node != 'true'
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: './package-lock.json'

    # setup-node の cache: 'npm' を使えない環境でも、npm ci が毎回レジストリから取り直さないようにする。
    # キャッシュの場所は環境で変わるため、npm に聞く
    - name: Get npm cache directory
      id: npm-cache
      if: inputs.skip-setup-node == 'true'
      shell: bash
      run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Cache npm
      if: inputs.skip-setup-node == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    # libs 間の依存順は build:libs が持つため、呼び出し側で個別に並べない
    - name: Build shared libs
      shell: bash
      run: npm run build:libs

    - name: Build shared workspaces
      if: inputs.shared-workspaces != ''
      shell: bash
      run: |
        IFS=',' read -ra WORKSPACES <<< "${{ inputs.shared-workspaces }}"
        for workspace in "${WORKSPACES[@]}"; do
          workspace="$(echo "$workspace" | xargs)"
          if [ -z "$workspace" ]; then
            continue
          fi
          npm run build --workspace "$workspace"
        done

    - name: Build target workspace
      shell: bash
      run: npm run build --workspace "${{ inputs.workspace }}"
