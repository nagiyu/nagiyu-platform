name: Dev Sync - Build and Deploy

on:
  push:
    branches:
      - develop
      - 'integration/**'
    paths:
      - 'services/dev-sync/**'
      - 'infra/dev-sync/**'
      - 'infra/common/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dev-sync-deploy.yml'
      - '.github/actions/update-lambda-image/**'
      - '.github/actions/push-ecr-image/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ環境'
        required: true
        type: choice
        options:
          - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

jobs:
  deploy-ecr:
    name: Deploy ECR Stack
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      environment: ${{ steps.setup-environment.outputs.environment }}
      stack-suffix: ${{ steps.setup-environment.outputs.stack-suffix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: package-lock.json

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-dev-sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECR Stack
        env:
          ENVIRONMENT: ${{ steps.setup-environment.outputs.environment }}
          STACK_SUFFIX: ${{ steps.setup-environment.outputs.stack-suffix }}
        run: |
          echo "ECR スタックをデプロイします (環境: $ENVIRONMENT)..."
          npm run cdk --workspace=@nagiyu/infra-dev-sync -- deploy \
            NagiyuDevSyncECR${STACK_SUFFIX} \
            --context env="$ENVIRONMENT" \
            --require-approval never

  build-batch:
    name: Build and Push Batch Docker Image
    runs-on: ubuntu-latest
    needs: deploy-ecr
    environment: dev

    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository from CDK stack
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.deploy-ecr.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuDevSyncECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: CDK スタック $STACK_NAME から ECR リポジトリ URI を取得できませんでした"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR リポジトリ (Batch): $REPOSITORY_URI"

      - name: Build and push Batch Docker image
        id: build-image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/dev-sync/batch/Dockerfile
          # CDK 側が tagOrDigest: 'latest' を参照するため、latest も push する
          tags: |
            ${{ github.sha }}
            latest

  deploy-main:
    name: Deploy Main Stack
    runs-on: ubuntu-latest
    needs: [deploy-ecr, build-batch]
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: package-lock.json

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-dev-sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Main Stack
        env:
          ENVIRONMENT: ${{ needs.deploy-ecr.outputs.environment }}
          STACK_SUFFIX: ${{ needs.deploy-ecr.outputs.stack-suffix }}
        run: |
          echo "メインスタックをデプロイします (環境: $ENVIRONMENT)..."
          npm run cdk --workspace=@nagiyu/infra-dev-sync -- deploy \
            NagiyuDevSync${STACK_SUFFIX} \
            --context env="$ENVIRONMENT" \
            --require-approval never

      - name: Resolve Lambda image URI
        id: resolve-image
        env:
          ENVIRONMENT: ${{ needs.deploy-ecr.outputs.environment }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/nagiyu-dev-sync-ecr-$ENVIRONMENT:latest"

          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Lambda image URI: $IMAGE_URI"

      - name: Update Lambda function with latest image
        uses: ./.github/actions/update-lambda-image
        with:
          function-names: |
            nagiyu-dev-sync-${{ needs.deploy-ecr.outputs.environment }}
          image-uri: ${{ steps.resolve-image.outputs.image-uri }}
          region: ${{ env.AWS_REGION }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy-ecr, build-batch, deploy-main]

    steps:
      - name: Display deployment summary
        env:
          ENVIRONMENT: ${{ needs.deploy-ecr.outputs.environment }}
        run: |
          echo "## Dev Sync デプロイサマリー - $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### デプロイ状況" >> $GITHUB_STEP_SUMMARY
          echo "| ジョブ | 結果 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ECR スタックデプロイ | ${{ needs.deploy-ecr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Batch Docker ビルド & プッシュ | ${{ needs.build-batch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| メインスタックデプロイ | ${{ needs.deploy-main.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Batch Image**: \`${{ needs.build-batch.outputs.image-uri }}\`" >> $GITHUB_STEP_SUMMARY
