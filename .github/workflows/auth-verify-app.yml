name: Auth App - Verification

env:
  SERVICE_ID: auth-app
  SERVICE_DISPLAY_NAME: Auth App

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/auth/**'
      - 'libs/**'
      - 'infra/auth/**'
      - 'infra/common/**'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-verify-app.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: services/auth
    permissions:
      contents: read

  e2e:
    name: E2E
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/auth-web'
      shared-workspaces: '@nagiyu/auth-core'
      web-dir: services/auth/web
      report-key: auth-app
      full: ${{ github.base_ref == 'develop' }}
    permissions:
      id-token: write
      contents: read

  build:
    name: Next.js Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Next.js application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/auth-web'
          shared-workspaces: '@nagiyu/auth-core'

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/auth/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/auth/web/Dockerfile
          image-tag: auth-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, e2e, build, docker-build]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: auth-app
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
