name: Weekly NPM Management Check

on:
  schedule:
    # 毎週土曜日 3:17 JST (金曜日 18:17 UTC)
    - cron: '17 18 * * 5'
  workflow_dispatch: # 手動実行も可能

permissions:
  issues: write
  contents: read

jobs:
  # 重い処理 (npm ci など) の前に判定し、既存 Issue があれば後続ジョブごとスキップする
  duplicate-check:
    runs-on: ubuntu-latest
    outputs:
      should_create: ${{ steps.duplicate_check.outputs.should_create }}
    steps:
      - name: Check existing open weekly-check issue
        id: duplicate_check
        env:
          GH_TOKEN: ${{ github.token }}
          # checkout しないため、対象リポジトリを明示する
          GH_REPO: ${{ github.repository }}
        run: |
          OPEN_ISSUES_JSON=$(gh issue list \
            --label "weekly-check" \
            --state open \
            --limit 1 \
            --json number,url)

          ISSUE_NUMBER=$(echo "$OPEN_ISSUES_JSON" | jq -r '.[0]? | .number // empty')
          ISSUE_URL=$(echo "$OPEN_ISSUES_JSON" | jq -r '.[0]? | .url // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "open_issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "open_issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          else
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary (skipped)
        if: steps.duplicate_check.outputs.should_create != 'true'
        run: |
          echo "⏭️ 既存の weekly-check ラベル付きオープン Issue が存在するため、新規作成をスキップしました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.duplicate_check.outputs.open_issue_number }}" ] && [ -n "${{ steps.duplicate_check.outputs.open_issue_url }}" ]; then
            echo "**既存Issue**: #${{ steps.duplicate_check.outputs.open_issue_number }} (${{ steps.duplicate_check.outputs.open_issue_url }})" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.duplicate_check.outputs.open_issue_number }}" ]; then
            echo "**既存Issue**: #${{ steps.duplicate_check.outputs.open_issue_number }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**既存Issue**: 取得できませんでした" >> "$GITHUB_STEP_SUMMARY"
          fi

  npm-check:
    needs: duplicate-check
    if: needs.duplicate-check.outputs.should_create == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      # 実行時刻 (金曜 18:17 UTC) は UTC では前日にあたるため、年・週番号・日付は JST で決める
      - name: Get current week info
        id: week_info
        run: |
          YEAR=$(TZ=Asia/Tokyo date +%Y)
          WEEK=$(TZ=Asia/Tokyo date +%U)
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "title=[NPM管理] ${YEAR}年第${WEEK}週 パッケージ管理レポート (${DATE})" >> $GITHUB_OUTPUT

      - name: Calculate next check date
        id: next_check
        run: |
          NEXT_SATURDAY=$(TZ=Asia/Tokyo date -d "next saturday" +%Y-%m-%d)
          echo "next_date=$NEXT_SATURDAY" >> $GITHUB_OUTPUT

      - name: Check npm outdated
        id: outdated
        run: |
          OUTPUT_FILE=$(mktemp)
          .github/workflows/scripts/check-npm-outdated.sh > "$OUTPUT_FILE"
          # Base64エンコードして安全に保存
          ENCODED=$(base64 -w 0 "$OUTPUT_FILE")
          echo "outdated=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Check npm audit
        id: audit
        run: |
          OUTPUT_FILE=$(mktemp)
          .github/workflows/scripts/check-npm-audit.sh > "$OUTPUT_FILE"
          # Base64エンコードして安全に保存
          ENCODED=$(base64 -w 0 "$OUTPUT_FILE")
          echo "audit=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Check duplicate packages
        id: duplicates
        run: |
          OUTPUT_FILE=$(mktemp)
          .github/workflows/scripts/check-duplicates.sh > "$OUTPUT_FILE"
          # Base64エンコードして安全に保存
          ENCODED=$(base64 -w 0 "$OUTPUT_FILE")
          echo "duplicates=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Check version inconsistency
        id: inconsistency
        run: |
          OUTPUT_FILE=$(mktemp)
          .github/workflows/scripts/check-version-inconsistency.sh > "$OUTPUT_FILE"
          # Base64エンコードして安全に保存
          ENCODED=$(base64 -w 0 "$OUTPUT_FILE")
          echo "inconsistency=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Prepare issue body
        id: issue_body
        env:
          OUTDATED: ${{ steps.outdated.outputs.outdated }}
          AUDIT: ${{ steps.audit.outputs.audit }}
          DUPLICATES: ${{ steps.duplicates.outputs.duplicates }}
          INCONSISTENCY: ${{ steps.inconsistency.outputs.inconsistency }}
          NEXT_DATE: ${{ steps.next_check.outputs.next_date }}
        run: |
          CREATE_TIME=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M JST")
          export CREATE_TIME
          # Python スクリプトでBase64デコードして本文を生成
          BODY=$(python3 .github/workflows/scripts/prepare-npm-issue.py)
          # 生成した本文をBase64エンコードして保存
          ENCODED=$(echo "$BODY" | base64 -w 0)
          echo "issue_body=$ENCODED" >> "$GITHUB_OUTPUT"

      - name: Create npm management issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Base64デコードしてIssue本文を取得
          BODY=$(echo "${{ steps.issue_body.outputs.issue_body }}" | base64 -d)
          gh issue create \
            --title "${{ steps.week_info.outputs.title }}" \
            --label "dependencies,weekly-check" \
            --body "$BODY"

      - name: Summary
        run: |
          echo "✅ 週次npm管理レポート Issue を作成しました" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**タイトル**: ${{ steps.week_info.outputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**次回チェック予定**: ${{ steps.next_check.outputs.next_date }}" >> $GITHUB_STEP_SUMMARY
