name: Portal - Verification

env:
  SERVICE_ID: portal
  SERVICE_DISPLAY_NAME: Portal

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/portal/**'
      - 'libs/**'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/portal-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: services/portal
    permissions:
      contents: read

  build:
    name: Next.js Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Next.js application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/portal-web'

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/portal/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/portal/web/Dockerfile
          image-tag: portal-verify-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  # サービス固有の検査のため、再利用ワークフローには含めない
  internal-links:
    name: Check Internal Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: 内部リンクチェック
        run: npm run check:internal-links --workspace @nagiyu/portal-web

  e2e:
    name: E2E
    needs: [build]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/portal-web'
      web-dir: services/portal/web
      report-key: portal
      full: ${{ github.base_ref == 'develop' }}
    permissions:
      id-token: write
      contents: read

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, build, docker-build, internal-links, e2e]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: portal
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
