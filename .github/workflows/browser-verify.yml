name: Browser Library - Verification

on:
  pull_request:
    branches:
      - develop
      - integration/**
    paths:
      - 'libs/**'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-verify.yml'
      - '.github/workflows/reusable-lib-verify.yml'

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-lib-verify.yml
    with:
      workspace: '@nagiyu/browser'
      display-name: Browser Library
    permissions:
      contents: read
      pull-requests: write
      actions: read
