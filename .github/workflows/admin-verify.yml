name: Admin App - Verification

env:
  SERVICE_ID: admin
  SERVICE_DISPLAY_NAME: Admin App

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/admin/**'
      - 'libs/**'
      - 'infra/admin/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Run lint
        run: npm run lint --workspace @nagiyu/admin

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check formatting
        run: npm run format:check --workspace @nagiyu/admin

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: |
          npm run build:libs
          npm run build --workspace @nagiyu/admin-core

      - name: Run unit tests
        run: npm run test --workspace @nagiyu/admin

  contract-test:
    name: Run Contract Tests (DynamoDB Local)
    runs-on: ubuntu-latest
    needs: [build]

    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run contract tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm run test:contract --workspace @nagiyu/admin-core

  coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    needs: [unit-test]
    if: github.base_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: |
          npm run build:libs
          npm run build --workspace @nagiyu/admin-core

      - name: Run tests with coverage
        run: npm run test:coverage --workspace @nagiyu/admin

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat services/admin/web/coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Error: Coverage is below 80%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-coverage-report
          path: services/admin/web/coverage/
          retention-days: 30

  e2e:
    name: E2E
    needs: [unit-test]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/admin'
      shared-workspaces: '@nagiyu/admin-core'
      web-dir: services/admin/web
      report-key: admin
      full: ${{ github.base_ref == 'develop' }}
    permissions:
      id-token: write
      contents: read

  build:
    name: Next.js Build Verification
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Next.js application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/admin'
          shared-workspaces: '@nagiyu/admin-core'

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/admin/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/admin/web/Dockerfile
          image-tag: admin-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, format-check, unit-test, contract-test, coverage, e2e, build, docker-build]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: admin
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
