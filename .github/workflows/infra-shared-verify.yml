name: Infra Shared - Verification

env:
  SERVICE_ID: infra-shared
  SERVICE_DISPLAY_NAME: Infra Shared

on:
  pull_request:
    branches:
      - develop
      - integration/**
    paths:
      - 'infra/shared/**'
      - 'infra/common/**'
      - 'configs/**'
      - '.github/actions/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/infra-shared-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-infra-verify.yml'

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: infra/shared
    permissions:
      contents: read

  infra-verify:
    name: Infra Verify
    uses: ./.github/workflows/reusable-infra-verify.yml
    with:
      dirs: infra/shared
      # 既定の prod スコープと dev アカウントのスコープの両方で、組み立てが通ることを確かめる
      synth-args: |
        DOMAIN_NAME=example.com --all --context env=dev
        DOMAIN_NAME=example.com --all --context env=dev --context accountScope=dev
    permissions:
      contents: read

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, infra-verify]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
