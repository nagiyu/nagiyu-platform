name: Niconico Mylist Assistant - Verification

env:
  SERVICE_ID: niconico-mylist-assistant
  SERVICE_DISPLAY_NAME: Niconico Mylist Assistant

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/niconico-mylist-assistant/**'
      - 'infra/niconico-mylist-assistant/**'
      - 'libs/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/niconico-mylist-assistant-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: services/niconico-mylist-assistant infra/niconico-mylist-assistant
    permissions:
      contents: read

  build-core:
    name: Build Core Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core library
        run: npm run build --workspace=@nagiyu/niconico-mylist-assistant-core

  build-infra:
    name: Build Infrastructure Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-niconico-mylist-assistant

  build-web:
    name: Build Web Package
    runs-on: ubuntu-latest
    needs: [build-core]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build web application
        uses: ./.github/actions/build-web-app
        env:
          # Next.js build時にAPI routeの評価で参照されるため、CIではダミー値を設定
          DYNAMODB_TABLE_NAME: dummy-table
        with:
          workspace: '@nagiyu/niconico-mylist-assistant-web'
          shared-workspaces: '@nagiyu/niconico-mylist-assistant-core'

  build-batch:
    name: Build Batch Package
    runs-on: ubuntu-latest
    needs: [build-core]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core library
        run: npm run build --workspace=@nagiyu/niconico-mylist-assistant-core

      - name: Build batch application
        run: npm run build --workspace=@nagiyu/niconico-mylist-assistant-batch

  docker-build-web:
    name: Docker Build Web
    runs-on: ubuntu-latest
    needs: [build-web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/niconico-mylist-assistant/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Web Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/niconico-mylist-assistant/web/Dockerfile
          image-tag: niconico-mylist-assistant-web-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  docker-build-batch:
    name: Docker Build Batch
    runs-on: ubuntu-latest
    needs: [build-batch]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/niconico-mylist-assistant/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Batch Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/niconico-mylist-assistant/batch/Dockerfile
          image-tag: niconico-mylist-assistant-batch-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  e2e:
    name: E2E
    needs: [build-web]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/niconico-mylist-assistant-web'
      shared-workspaces: '@nagiyu/niconico-mylist-assistant-core'
      web-dir: services/niconico-mylist-assistant/web
      report-key: niconico-mylist-assistant
      full: ${{ github.base_ref == 'develop' }}
      env: |
        DYNAMODB_TABLE_NAME=dummy-table
    permissions:
      id-token: write
      contents: read

  test-batch-integration:
    name: Batch Integration Tests
    runs-on: ubuntu-latest
    needs: [build-batch]
    if: github.base_ref == 'develop'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core library
        run: npm run build --workspace=@nagiyu/niconico-mylist-assistant-core

      - name: Build batch application
        run: npm run build --workspace=@nagiyu/niconico-mylist-assistant-batch

      - name: Run batch integration tests
        run: npm run test:integration --workspace=@nagiyu/niconico-mylist-assistant-batch
        continue-on-error: true

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        verify,
        build-core,
        build-infra,
        build-web,
        build-batch,
        docker-build-web,
        docker-build-batch,
        e2e,
        test-batch-integration,
      ]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: niconico-mylist-assistant
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
