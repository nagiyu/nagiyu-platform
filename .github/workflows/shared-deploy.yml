name: Deploy Shared Infrastructure

on:
  push:
    branches:
      - develop
      - integration/**
      - master
    paths:
      - 'infra/shared/**'
      # SSM キーの定義は infra-common にあり、変わったら書き込む側の shared も組み直す。
      - 'infra/common/**'
      - 'configs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/shared-deploy.yml'
      - '.github/actions/setup-cdk/**'
      - '.github/actions/setup-environment/**'
      - '.github/actions/setup-node/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # shared は ts-node で動くため、サービスの infra のビルドは要らない
      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "AWS Account ID: $ACCOUNT_ID"

      - name: CDK Bootstrap (if needed)
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          npm run bootstrap --workspace=@nagiyu/infra-shared -- aws://${{ steps.get-account-id.outputs.account-id }}/us-east-1

      - name: CDK Synth
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          npm run synth --workspace=@nagiyu/infra-shared -- --all --context env=${{ steps.setup-environment.outputs.environment }}

      - name: CDK Deploy
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          npm run deploy --workspace=@nagiyu/infra-shared -- --all \
            --context env=${{ steps.setup-environment.outputs.environment }} \
            --require-approval never

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.setup-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: us-east-1" >> $GITHUB_STEP_SUMMARY
          echo "- **Stacks**: VPC, ACM, Route53, IAM Policies, IAM Claude Access" >> $GITHUB_STEP_SUMMARY
