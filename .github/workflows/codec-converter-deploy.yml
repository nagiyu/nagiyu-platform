name: Codec Converter - Deploy Infrastructure

on:
  push:
    branches:
      - develop
      - integration/**
      - master
    paths:
      - 'services/codec-converter/**'
      - 'infra/codec-converter/**'
      - 'infra/common/**'
      - 'libs/**'
      - 'configs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/codec-converter-deploy.yml'
      - '.github/actions/build-docker-image/**'
      - '.github/actions/build-web-app/**'
      - '.github/actions/get-stack-output/**'
      - '.github/actions/health-check/**'
      - '.github/actions/push-ecr-image/**'
      - '.github/actions/setup-cdk/**'
      - '.github/actions/setup-environment/**'
      - '.github/actions/setup-node/**'
      - '.github/scripts/docker-build-with-retry.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  # push するタグと CDK が指すタグを同じ値にするため、全ジョブで共有する。
  # CDK はどのスタックを deploy するときもアプリ全体を合成するので、ECR だけの deploy にも要る。
  IMAGE_TAG: ${{ github.sha }}

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  prepare-infrastructure:
    name: Prepare Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}

    permissions:
      id-token: write
      contents: read

    outputs:
      environment: ${{ steps.setup-environment.outputs.environment }}
      stack-name: ${{ steps.setup-environment.outputs.stack-name }}
      stack-suffix: ${{ steps.setup-environment.outputs.stack-suffix }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment
        with:
          stack-name-prefix: NagiyuCodecConverter

      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          infra-workspace: '@nagiyu/infra-codec-converter'
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "AWS Account ID: $ACCOUNT_ID"

      - name: CDK Bootstrap (if needed)
        env:
          ACCOUNT_ID: ${{ steps.get-account-id.outputs.account-id }}
        run: |
          # Bootstrap is idempotent - safe to run on every deployment
          npm run bootstrap --workspace=@nagiyu/infra-codec-converter -- aws://$ACCOUNT_ID/${{ env.AWS_REGION }} \
            --context env=${{ steps.setup-environment.outputs.environment }}

      - name: Deploy ECR Stacks
        env:
          ENVIRONMENT: ${{ steps.setup-environment.outputs.environment }}
          STACK_SUFFIX: ${{ steps.setup-environment.outputs.stack-suffix }}
        run: |
          npm run cdk --workspace=@nagiyu/infra-codec-converter -- deploy \
            NagiyuCodecConverterECR${STACK_SUFFIX} \
            NagiyuCodecConverterBatchECR${STACK_SUFFIX} \
            --context env="$ENVIRONMENT" \
            --require-approval never

          echo "ECR repositories deployed (environment: $ENVIRONMENT)"

  build-web:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    needs: prepare-infrastructure
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    outputs:
      app-version: ${{ steps.get-version.outputs.app-version }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/codec-converter/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Build Web application
        uses: ./.github/actions/build-web-app
        with:
          # Node はイメージに入っているものを使う
          skip-setup-node: 'true'
          workspace: '@nagiyu/codec-converter-web'
          shared-workspaces: '@nagiyu/codec-converter-core'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URI
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuCodecConverterECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR Repository: $REPOSITORY_URI"

      - name: Build and push Web Docker image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/codec-converter/web/Dockerfile
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_TAG }}

  build-batch:
    name: Build and Push Batch Worker Image
    runs-on: ubuntu-latest
    needs: prepare-infrastructure
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/codec-converter/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URI
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuCodecConverterBatchECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR Repository: $REPOSITORY_URI"

      - name: Build and push Batch worker Docker image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/codec-converter/batch/Dockerfile
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: [prepare-infrastructure, build-web, build-batch]
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          infra-workspace: '@nagiyu/infra-codec-converter'
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy (Application Stack)
        env:
          ENVIRONMENT: ${{ needs.prepare-infrastructure.outputs.environment }}
          STACK_NAME: ${{ needs.prepare-infrastructure.outputs.stack-name }}
          APP_VERSION: ${{ needs.build-web.outputs.app-version }}
        run: |
          npm run deploy --workspace=@nagiyu/infra-codec-converter -- $STACK_NAME \
            --context env=$ENVIRONMENT \
            --verbose

      - name: Get CloudFront domain
        id: get-cloudfront-url
        uses: ./.github/actions/get-stack-output
        with:
          stack-name: ${{ needs.prepare-infrastructure.outputs.stack-name }}
          region: ${{ env.AWS_REGION }}
          output-key: CloudFrontDomainName

      - name: Verify deployment
        uses: ./.github/actions/health-check
        with:
          base-url: https://${{ steps.get-cloudfront-url.outputs.value }}

      - name: Display stack outputs
        env:
          STACK_NAME: ${{ needs.prepare-infrastructure.outputs.stack-name }}
        run: |
          echo "=== CDK Stack Outputs ==="
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region ${{ env.AWS_REGION }} \
            --output table
