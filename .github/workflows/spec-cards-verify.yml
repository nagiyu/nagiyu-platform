name: Verify - 仕様カードの鮮度

# docs/specs/ の仕様カードはコードの写しで、frontmatter に元のソースのハッシュを持つ。
# ソースを変えたのにカードを作り直していない PR を、マージ前に止める。
# 依存を足さずランナーの Node で動かすため、setup-node は使わない。

on:
  pull_request:
    branches:
      - develop
      - master
      - 'integration/**'

env:
  SERVICE_DISPLAY_NAME: Spec cards

# 同じ PR の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仕様カードの鮮度と整合を検査
        run: node .github/workflows/scripts/spec-cards.mjs check

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [check]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = { '仕様カードの鮮度': '${{ needs.check.result }}' };
            const statusEmoji = { 'success': '✅', 'failure': '❌', 'cancelled': '⚠️', 'skipped': '⏭️' };
            const allSuccess = Object.values(results).every(r => r === 'success');
            const header = allSuccess
              ? '## ✅ [${{ env.SERVICE_DISPLAY_NAME }}] Verification Passed'
              : '## ❌ [${{ env.SERVICE_DISPLAY_NAME }}] Verification Failed';
            let body = `${header}\n\n`;
            body += '| Job | Status |\n';
            body += '|-----|--------|\n';
            for (const [job, result] of Object.entries(results)) {
              const emoji = statusEmoji[result] || '❓';
              body += `| ${job} | ${emoji} ${result} |\n`;
            }
            if (!allSuccess) {
              body += '\n> 仕様カードの元のソースが変わっています。`spec-card` スキルに沿って、本文が今のコードと合っているかを確かめてからカードを作り直してください。\n';
            }
            body += `\n[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: body });
