name: Weekly Exploratory Test

on:
  schedule:
    # 毎週土曜日 3:17 JST (金曜日 18:17 UTC)
    - cron: '17 18 * * 5'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-exploratory-test-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 実行時刻 (金曜 18:17 UTC) は UTC では前日にあたるため、日付は JST で決める
      - name: Get current date info
        id: date_info
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          CREATE_TIME=$(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M JST")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "create_time=$CREATE_TIME" >> "$GITHUB_OUTPUT"
          echo "title=[Exploratory] 探索的テスト ($DATE)" >> "$GITHUB_OUTPUT"

      - name: Calculate next issue date
        id: next_date
        run: |
          NEXT_SATURDAY=$(TZ=Asia/Tokyo date -d "next saturday" +%Y-%m-%d)
          echo "next_date=$NEXT_SATURDAY" >> "$GITHUB_OUTPUT"

      - name: Ensure exploratory-test label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "exploratory-test" \
            --description "週次の探索的テスト" \
            --color "5319e7" \
            2>/dev/null || true

      - name: Check existing open exploratory-test issue
        id: duplicate_check
        uses: ./.github/actions/find-open-issue
        with:
          label: exploratory-test

      - name: Prepare issue body from template
        id: issue_body
        if: steps.duplicate_check.outputs.should_create == 'true'
        env:
          NEXT_DATE: ${{ steps.next_date.outputs.next_date }}
          CREATE_TIME: ${{ steps.date_info.outputs.create_time }}
        run: |
          .github/workflows/scripts/prepare-issue-body.sh .github/workflows/templates/weekly-exploratory-test-body.md > "${RUNNER_TEMP}/issue_body.md"
          echo "body_file=${RUNNER_TEMP}/issue_body.md" >> "$GITHUB_OUTPUT"

      - name: Create weekly exploratory test issue
        if: steps.duplicate_check.outputs.should_create == 'true'
        uses: ./.github/actions/create-issue
        with:
          title: ${{ steps.date_info.outputs.title }}
          labels: exploratory-test
          body-file: ${{ steps.issue_body.outputs.body_file }}
          summary-heading: '✅ 週次の探索的テスト Issue を作成しました'
          summary-extra: |
            **次回作成予定**: ${{ steps.next_date.outputs.next_date }}
