name: Codec Converter - Verification

env:
  SERVICE_ID: codec-converter
  SERVICE_DISPLAY_NAME: Codec Converter

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/codec-converter/**'
      - 'infra/codec-converter/**'
      - 'libs/**'
      - 'infra/common/**'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codec-converter-verify.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nextjs-build:
    name: Next.js Build Verification
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Next.js application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/codec-converter-web'
          shared-workspaces: '@nagiyu/codec-converter-core'

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [nextjs-build]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get web version from package.json
        id: get-web-version
        working-directory: ./services/codec-converter/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get batch version from package.json
        id: get-batch-version
        working-directory: ./services/codec-converter/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Web Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/codec-converter/web/Dockerfile
          image-tag: codec-converter-web-verify-full-test
          build-args: APP_VERSION=${{ steps.get-web-version.outputs.app-version }}

      - name: Build Batch Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/codec-converter/batch/Dockerfile
          image-tag: codec-converter-batch-verify-full-test
          build-args: APP_VERSION=${{ steps.get-batch-version.outputs.app-version }}

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [nextjs-build]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build codec-converter-core library
        run: npm run build --workspace=@nagiyu/codec-converter-core

      - name: Run core tests
        run: npm run test --workspace=@nagiyu/codec-converter-core

      - name: Run batch tests
        run: npm run test --workspace=@nagiyu/codec-converter-batch

      - name: Run web tests
        run: npm run test --workspace=@nagiyu/codec-converter-web

  integration-test-chromium-mobile:
    name: Run Integration Tests (chromium-mobile)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [test]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build codec-converter-core library
        run: npm run build --workspace=@nagiyu/codec-converter-core

      - name: Build web application
        run: npm run build --workspace=@nagiyu/codec-converter-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./services/codec-converter/web

      - name: Run Integration tests (chromium-mobile)
        env:
          CI: true
          PROJECT: chromium-mobile
        run: npm run test:e2e --workspace=@nagiyu/codec-converter-web

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-chromium-mobile
          path: services/codec-converter/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-chromium-mobile
          path: services/codec-converter/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/codec-converter/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/codec-converter/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/chromium-mobile/" \
            --delete --no-progress

  integration-test-chromium-desktop:
    name: Run Integration Tests (chromium-desktop)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.base_ref == 'develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build codec-converter-core library
        run: npm run build --workspace=@nagiyu/codec-converter-core

      - name: Build web application
        run: npm run build --workspace=@nagiyu/codec-converter-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./services/codec-converter/web

      - name: Run Integration tests (chromium-desktop)
        env:
          CI: true
          PROJECT: chromium-desktop
        run: npm run test:e2e --workspace=@nagiyu/codec-converter-web

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-chromium-desktop
          path: services/codec-converter/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-chromium-desktop
          path: services/codec-converter/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/codec-converter/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/codec-converter/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/chromium-desktop/" \
            --delete --no-progress

  integration-test-webkit-mobile:
    name: Run Integration Tests (webkit-mobile)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.base_ref == 'develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build codec-converter-core library
        run: npm run build --workspace=@nagiyu/codec-converter-core

      - name: Build web application
        run: npm run build --workspace=@nagiyu/codec-converter-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps webkit
        working-directory: ./services/codec-converter/web

      - name: Run Integration tests (webkit-mobile)
        env:
          CI: true
          PROJECT: webkit-mobile
        run: npm run test:e2e --workspace=@nagiyu/codec-converter-web

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-webkit-mobile
          path: services/codec-converter/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-webkit-mobile
          path: services/codec-converter/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/codec-converter/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/codec-converter/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/webkit-mobile/" \
            --delete --no-progress

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Run ESLint on core
        run: npm run lint --workspace=@nagiyu/codec-converter-core

      - name: Run ESLint on web
        run: npm run lint --workspace=@nagiyu/codec-converter-web

      - name: Run ESLint on batch
        run: npm run lint --workspace=@nagiyu/codec-converter-batch

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check core formatting
        run: npm run format:check --workspace=@nagiyu/codec-converter-core

      - name: Check web formatting
        run: npm run format:check --workspace=@nagiyu/codec-converter-web

      - name: Check batch formatting
        run: npm run format:check --workspace=@nagiyu/codec-converter-batch

  infra-format-check:
    name: Infrastructure Format Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check formatting
        run: npx prettier --check "infra/codec-converter/**/*.{ts,js,json}"

  infra-type-check:
    name: Infrastructure Type Check (Build)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build infra-common library
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK project
        run: npm run build --workspace=@nagiyu/infra-codec-converter

  infra-test:
    name: Infrastructure Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build infra-common library
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Run tests
        run: npm run test --workspace=@nagiyu/infra-codec-converter

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        nextjs-build,
        docker-build,
        test,
        integration-test-chromium-mobile,
        integration-test-chromium-desktop,
        integration-test-webkit-mobile,
        lint,
        format-check,
        infra-format-check,
        infra-type-check,
        infra-test,
      ]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: codec-converter
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
