name: Share Together - Build and Deploy

on:
  push:
    branches:
      - develop
      - integration/**
      - master
    paths:
      - 'services/share-together/**'
      - 'infra/share-together/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'libs/**'
      - 'configs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/share-together-deploy.yml'
      - '.github/actions/build-docker-image/**'
      - '.github/actions/build-web-app/**'
      - '.github/actions/get-stack-output/**'
      - '.github/actions/health-check/**'
      - '.github/actions/push-ecr-image/**'
      - '.github/actions/setup-cdk/**'
      - '.github/actions/setup-environment/**'
      - '.github/actions/setup-node/**'
      - '.github/scripts/docker-build-with-retry.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # push するタグと CDK が指すタグを同じ値にするため、全ジョブで共有する。
  # CDK はどのスタックを deploy するときもアプリ全体を合成するので、ECR だけの deploy にも要る。
  IMAGE_TAG: ${{ github.sha }}

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  infrastructure-ecr:
    name: Deploy ECR and Core Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}

    outputs:
      environment: ${{ steps.setup-environment.outputs.environment }}
      stack-suffix: ${{ steps.setup-environment.outputs.stack-suffix }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment

      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          infra-workspace: '@nagiyu/infra-share-together'
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECR and DynamoDB Stacks
        env:
          ENVIRONMENT: ${{ steps.setup-environment.outputs.environment }}
          STACK_SUFFIX: ${{ steps.setup-environment.outputs.stack-suffix }}
        run: |
          npm run cdk --workspace=@nagiyu/infra-share-together -- deploy \
            NagiyuShareTogetherECR${STACK_SUFFIX} \
            NagiyuShareTogetherDynamoDB${STACK_SUFFIX} \
            --context env="$ENVIRONMENT" \
            --require-approval never

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: infrastructure-ecr
    environment: ${{ needs.infrastructure-ecr.outputs.environment }}

    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
      environment: ${{ needs.infrastructure-ecr.outputs.environment }}
      stack-suffix: ${{ needs.infrastructure-ecr.outputs.stack-suffix }}
      app-version: ${{ steps.get-version.outputs.app-version }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/share-together/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web application
        uses: ./.github/actions/build-web-app
        with:
          # Node はイメージに入っているものを使う
          skip-setup-node: 'true'
          workspace: '@nagiyu/share-together-web'
          shared-workspaces: '@nagiyu/share-together-core'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository from CDK stack
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.infrastructure-ecr.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuShareTogetherECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/share-together/web/Dockerfile
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_TAG }}

  infrastructure-app:
    name: Deploy Application Infrastructure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v3

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          infra-workspace: '@nagiyu/infra-share-together'
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch secrets from Secrets Manager
        id: fetch-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            NEXTAUTH_SECRET,nagiyu-auth-nextauth-secret-${{ needs.build.outputs.environment }}

      - name: Deploy Lambda and CloudFront Stacks
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          STACK_SUFFIX: ${{ needs.build.outputs.stack-suffix }}
          APP_VERSION: ${{ needs.build.outputs.app-version }}
          SECRET_VALUE: ${{ env.NEXTAUTH_SECRET }}
        run: |
          npm run cdk --workspace=@nagiyu/infra-share-together -- deploy \
            --all \
            --exclude NagiyuShareTogetherECR${STACK_SUFFIX} \
            --context env="$ENVIRONMENT" \
            --context appVersion="$APP_VERSION" \
            --context nextAuthSecret="$SECRET_VALUE" \
            --require-approval never

      - name: Get CloudFront domain
        id: get-cloudfront-url
        uses: ./.github/actions/get-stack-output
        with:
          stack-name: NagiyuShareTogetherCloudFront${{ needs.build.outputs.stack-suffix }}
          region: ${{ env.AWS_REGION }}
          output-key: DistributionDomainName

      - name: Verify deployment
        uses: ./.github/actions/health-check
        with:
          base-url: https://${{ steps.get-cloudfront-url.outputs.value }}
