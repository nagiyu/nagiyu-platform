name: Root Domain - Build and Deploy

on:
  push:
    branches:
      - develop
      - integration/**
      - master
    paths:
      - 'services/portal/**'
      - 'infra/bin/**'
      - 'infra/root/**'
      - 'infra/common/**'
      - 'infra/package.json'
      - 'infra/cdk.json'
      - 'infra/tsconfig.json'
      - 'libs/**'
      - 'configs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/root-deploy.yml'
      - '.github/actions/update-lambda-image/**'
      - '.github/actions/health-check/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  infrastructure-ecr:
    name: Deploy ECR Repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}

    outputs:
      environment: ${{ steps.setup-environment.outputs.environment }}
      stack-suffix: ${{ steps.setup-environment.outputs.stack-suffix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECR Stack
        env:
          ENVIRONMENT: ${{ steps.setup-environment.outputs.environment }}
          STACK_SUFFIX: ${{ steps.setup-environment.outputs.stack-suffix }}
        run: |
          npm run cdk --workspace=@nagiyu/infra -- deploy NagiyuPortalEcr${STACK_SUFFIX} \
            --require-approval never

          echo "ECR repository deployed (environment: $ENVIRONMENT)"

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: infrastructure-ecr
    environment: ${{ needs.infrastructure-ecr.outputs.environment }}

    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
      environment: ${{ needs.infrastructure-ecr.outputs.environment }}
      stack-suffix: ${{ needs.infrastructure-ecr.outputs.stack-suffix }}
      app-version: ${{ steps.get-version.outputs.app-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/portal/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Build Web application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/portal-web'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository from CDK stack
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.infrastructure-ecr.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuPortalEcr${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR Repository: $REPOSITORY_URI"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/portal/web/Dockerfile
          image-tag: ${{ steps.get-ecr.outputs.repository-uri }}:latest
          build-args: |
            APP_VERSION=${{ steps.get-version.outputs.app-version }}
            NAGIYU_ENV=${{ needs.infrastructure-ecr.outputs.environment }}

      - name: Push Docker image
        id: build-image
        env:
          REPOSITORY_URI: ${{ steps.get-ecr.outputs.repository-uri }}
          IMAGE_TAG: latest
        run: |
          docker push "$REPOSITORY_URI:$IMAGE_TAG"

          echo "image-uri=$REPOSITORY_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  infrastructure-app:
    name: Deploy Application Infrastructure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Dev 環境: Lambda + CloudFront スタック
      - name: Deploy Lambda and CloudFront Stacks (dev)
        if: needs.build.outputs.environment == 'dev'
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          STACK_SUFFIX: ${{ needs.build.outputs.stack-suffix }}
        run: |
          npm run cdk --workspace=@nagiyu/infra -- deploy \
            NagiyuPortalLambda${STACK_SUFFIX} \
            NagiyuRootCloudFront${STACK_SUFFIX} \
            --require-approval never

          echo "Lambda and CloudFront deployed (environment: $ENVIRONMENT)"

      - name: Resolve Lambda image URI (dev)
        id: resolve-image
        if: needs.build.outputs.environment == 'dev'
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/nagiyu-portal-ecr-${ENVIRONMENT}:latest"

          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Lambda image URI: $IMAGE_URI"

      - name: Update Lambda function with latest image (dev)
        if: needs.build.outputs.environment == 'dev'
        uses: ./.github/actions/update-lambda-image
        with:
          function-names: |
            nagiyu-portal-lambda-${{ needs.build.outputs.environment }}
          image-uri: ${{ steps.resolve-image.outputs.image-uri }}
          region: ${{ env.AWS_REGION }}

      # Prod 環境: ECS Cluster + ALB + ECS Service + CloudFront スタック
      - name: Deploy ECS Cluster, ALB, ECS Service and CloudFront Stacks (prod)
        if: needs.build.outputs.environment == 'prod'
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          STACK_SUFFIX: ${{ needs.build.outputs.stack-suffix }}
          IMAGE_TAG: latest
        run: |
          npm run cdk --workspace=@nagiyu/infra -- deploy \
            NagiyuRootCluster${STACK_SUFFIX} \
            NagiyuRootAlb${STACK_SUFFIX} \
            NagiyuRootService${STACK_SUFFIX} \
            NagiyuRootCloudFront${STACK_SUFFIX} \
            --require-approval never

          echo "ECS Cluster, ALB, Service and CloudFront deployed (environment: $ENVIRONMENT)"

      - name: Force new ECS service deployment (prod)
        if: needs.build.outputs.environment == 'prod'
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
        run: |
          aws ecs update-service \
            --cluster "nagiyu-root-cluster-${ENVIRONMENT}" \
            --service "nagiyu-root-service-${ENVIRONMENT}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

          echo "ECS service deployment triggered."

      - name: Wait for ECS service to stabilize (prod)
        if: needs.build.outputs.environment == 'prod'
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster "nagiyu-root-cluster-${ENVIRONMENT}" \
            --services "nagiyu-root-service-${ENVIRONMENT}" \
            --region "${{ env.AWS_REGION }}"

          echo "ECS service is stable."

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, infrastructure-app]
    environment: ${{ needs.build.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFront URL
        id: get-cloudfront-url
        env:
          STACK_SUFFIX: ${{ needs.build.outputs.stack-suffix }}
        run: |
          STACK_NAME="NagiyuRootCloudFront${STACK_SUFFIX}"

          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          # ドメインが空のまま https:// だけが渡ると URL の欠落をヘルスチェックが検出できないため、空のときは空のまま渡す
          if [ -n "$CF_DOMAIN" ]; then
            BASE_URL="https://${CF_DOMAIN}"
          else
            BASE_URL=""
          fi

          echo "base-url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "CloudFront URL: $BASE_URL"

      - name: Verify deployment
        uses: ./.github/actions/health-check
        with:
          base-url: ${{ steps.get-cloudfront-url.outputs.base-url }}

      - name: Display deployment summary
        env:
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          STACK_SUFFIX: ${{ needs.build.outputs.stack-suffix }}
        run: |
          CF_STACK_NAME="NagiyuRootCloudFront${STACK_SUFFIX}"
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "$CF_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [[ "$ENVIRONMENT" == "prod" ]]; then
            CUSTOM_DOMAIN="nagiyu.com"
          else
            CUSTOM_DOMAIN="dev.nagiyu.com"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=== Deployment Summary ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version**: ${{ needs.build.outputs.app-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.build.outputs.image-uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Domain**: $CF_DOMAIN" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Domain**: https://$CUSTOM_DOMAIN" >> $GITHUB_STEP_SUMMARY
