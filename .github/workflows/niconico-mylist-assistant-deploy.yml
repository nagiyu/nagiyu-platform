name: Niconico Mylist Assistant - Deploy Infrastructure

on:
  push:
    branches:
      - develop
      - integration/**
      - master
    paths:
      - 'services/niconico-mylist-assistant/**'
      - 'infra/niconico-mylist-assistant/**'
      - 'infra/common/**'
      - 'libs/**'
      - 'configs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/niconico-mylist-assistant-deploy.yml'
      - '.github/actions/health-check/**'
      - '.github/actions/push-ecr-image/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  # push するタグと CDK が指すタグを同じ値にするため、全ジョブで共有する。
  # CDK はどのスタックを deploy するときもアプリ全体を合成するので、ECR だけの deploy にも要る。
  IMAGE_TAG: ${{ github.sha }}

# dev 環境は integration/** と develop で共有するため、ブランチではなくデプロイ先環境の単位で直列化する。
# CDK デプロイを途中で止めるとスタックが更新中のまま残るので実行中の run は完走させ、待機中は最新の run だけを残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  prepare-infrastructure:
    name: Prepare Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/master' && 'prod' || 'dev') }}

    permissions:
      id-token: write
      contents: read

    outputs:
      environment: ${{ steps.setup-environment.outputs.environment }}
      stack-suffix: ${{ steps.setup-environment.outputs.stack-suffix }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        id: setup-environment
        uses: ./.github/actions/setup-environment

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          # Node はイメージに入っているものを使う
          skip-setup-node: 'true'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK project
        run: npm run build --workspace=@nagiyu/infra-niconico-mylist-assistant

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: get-account-id
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "AWS Account ID: $ACCOUNT_ID"

      - name: CDK Bootstrap (if needed)
        env:
          ACCOUNT_ID: ${{ steps.get-account-id.outputs.account-id }}
        run: |
          # Bootstrap is idempotent - safe to run on every deployment
          npm run cdk --workspace=@nagiyu/infra-niconico-mylist-assistant -- bootstrap \
            aws://$ACCOUNT_ID/${{ env.AWS_REGION }} \
            --context env=${{ steps.setup-environment.outputs.environment }}

      - name: Deploy Infrastructure Stacks (DynamoDB, Secrets, ECR, S3)
        env:
          ENVIRONMENT: ${{ steps.setup-environment.outputs.environment }}
          STACK_SUFFIX: ${{ steps.setup-environment.outputs.stack-suffix }}
        run: |
          # CDK deploy is idempotent - no need for existence checks
          echo "Deploying infrastructure stacks..."
          npm run cdk --workspace=@nagiyu/infra-niconico-mylist-assistant -- deploy \
            "NagiyuNiconicoMylistAssistantDynamoDB${STACK_SUFFIX}" \
            "NagiyuNiconicoMylistAssistantSecrets${STACK_SUFFIX}" \
            "NagiyuNiconicoMylistAssistantWebECR${STACK_SUFFIX}" \
            "NagiyuNiconicoMylistAssistantBatchECR${STACK_SUFFIX}" \
            "NagiyuNiconicoMylistAssistantS3${STACK_SUFFIX}" \
            --context env=$ENVIRONMENT \
            --require-approval never

  build-web:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    needs: prepare-infrastructure
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    outputs:
      app-version: ${{ steps.get-version.outputs.app-version }}

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/niconico-mylist-assistant/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Build web application
        uses: ./.github/actions/build-web-app
        env:
          # Next.js build時にAPI routeの評価で参照されるため、CIではダミー値を設定
          DYNAMODB_TABLE_NAME: dummy-table
        with:
          # Node はイメージに入っているものを使う
          skip-setup-node: 'true'
          workspace: '@nagiyu/niconico-mylist-assistant-web'
          shared-workspaces: '@nagiyu/niconico-mylist-assistant-core'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URI
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          # CDK スタック名を構築
          STACK_NAME="NagiyuNiconicoMylistAssistantWebECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR Repository: $REPOSITORY_URI"

      - name: Build and push Web Docker image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/niconico-mylist-assistant/web/Dockerfile
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_TAG }}

  build-batch:
    name: Build and Push Batch Worker Image
    runs-on: ubuntu-latest
    needs: prepare-infrastructure
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/niconico-mylist-assistant/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URI
        id: get-ecr
        env:
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          # CDK スタック名を構築
          STACK_NAME="NagiyuNiconicoMylistAssistantBatchECR${STACK_SUFFIX}"

          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" \
            --output text \
            --region "${{ env.AWS_REGION }}")

          if [ -z "$REPOSITORY_URI" ]; then
            echo "Error: Could not find ECR repository URI from CDK stack $STACK_NAME"
            exit 1
          fi

          echo "repository-uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "ECR Repository: $REPOSITORY_URI"

      - name: Build and push Batch worker Docker image
        uses: ./.github/actions/push-ecr-image
        with:
          repository-uri: ${{ steps.get-ecr.outputs.repository-uri }}
          dockerfile: services/niconico-mylist-assistant/batch/Dockerfile
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy Full Stack
    runs-on: ubuntu-latest
    needs: [prepare-infrastructure, build-web, build-batch]
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          # Node はイメージに入っているものを使う
          skip-setup-node: 'true'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK project
        run: npm run build --workspace=@nagiyu/infra-niconico-mylist-assistant

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch secrets from Secrets Manager
        id: fetch-secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            NEXTAUTH_SECRET,nagiyu-auth-nextauth-secret-${{ needs.prepare-infrastructure.outputs.environment }}
            VAPID,nagiyu-niconico-mylist-assistant-vapid-${{ needs.prepare-infrastructure.outputs.environment }}
          parse-json-secrets: true

      - name: Deploy Application Stacks
        env:
          ENVIRONMENT: ${{ needs.prepare-infrastructure.outputs.environment }}
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
          APP_VERSION: ${{ needs.build-web.outputs.app-version }}
          SECRET_VALUE: ${{ env.NEXTAUTH_SECRET }}
          VAPID_PUBLIC: ${{ env.VAPID_PUBLICKEY }}
          VAPID_PRIVATE: ${{ env.VAPID_PRIVATEKEY }}
        run: |
          echo "Deploying application infrastructure (environment: $ENVIRONMENT)..."
          npm run cdk --workspace=@nagiyu/infra-niconico-mylist-assistant -- deploy \
            --context env="$ENVIRONMENT" \
            --context nextAuthSecret="${SECRET_VALUE}" \
            --context vapidPublicKey="$VAPID_PUBLIC" \
            --context vapidPrivateKey="$VAPID_PRIVATE" \
            --require-approval never \
            --all \
            --exclude "NagiyuNiconicoMylistAssistantDynamoDB${STACK_SUFFIX}" \
            --exclude "NagiyuNiconicoMylistAssistantSecrets${STACK_SUFFIX}" \
            --exclude "NagiyuNiconicoMylistAssistantWebECR${STACK_SUFFIX}" \
            --exclude "NagiyuNiconicoMylistAssistantBatchECR${STACK_SUFFIX}" \
            --exclude "NagiyuNiconicoMylistAssistantS3${STACK_SUFFIX}"

          echo "Application infrastructure deployed (environment: $ENVIRONMENT)"

      - name: Display stack outputs
        env:
          ENVIRONMENT: ${{ needs.prepare-infrastructure.outputs.environment }}
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          echo "=== CDK Stack Outputs ==="

          # Lambda Stack outputs
          echo ""
          echo "Lambda Stack:"
          aws cloudformation describe-stacks \
            --stack-name "NagiyuNiconicoMylistAssistantLambda${STACK_SUFFIX}" \
            --query "Stacks[0].Outputs" \
            --region ${{ env.AWS_REGION }} \
            --output table || echo "Lambda stack not found"

          # CloudFront Stack outputs
          echo ""
          echo "CloudFront Stack:"
          aws cloudformation describe-stacks \
            --stack-name "NagiyuNiconicoMylistAssistantCloudFront${STACK_SUFFIX}" \
            --query "Stacks[0].Outputs" \
            --region ${{ env.AWS_REGION }} \
            --output table || echo "CloudFront stack not found"

          # Batch Stack outputs
          echo ""
          echo "Batch Stack:"
          aws cloudformation describe-stacks \
            --stack-name "NagiyuNiconicoMylistAssistantBatch${STACK_SUFFIX}" \
            --query "Stacks[0].Outputs" \
            --region ${{ env.AWS_REGION }} \
            --output table || echo "Batch stack not found"

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [prepare-infrastructure, build-web, build-batch, deploy]
    environment: ${{ needs.prepare-infrastructure.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    # 検査と同じ実行環境でビルドとデプロイを行うため、共通イメージの上で動かす。docker のデーモンはランナーのものを使う
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda Function URL
        id: get-lambda-url
        env:
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name "NagiyuNiconicoMylistAssistantLambda${STACK_SUFFIX}" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "function-url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "Function URL: $FUNCTION_URL"

      - name: Verify Lambda deployment
        uses: ./.github/actions/health-check
        with:
          base-url: ${{ steps.get-lambda-url.outputs.function-url }}

      - name: Display deployment summary
        env:
          ENVIRONMENT: ${{ needs.prepare-infrastructure.outputs.environment }}
          STACK_SUFFIX: ${{ needs.prepare-infrastructure.outputs.stack-suffix }}
        run: |
          # Get CloudFront distribution domain (if exists)
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "NagiyuNiconicoMylistAssistantCloudFront${STACK_SUFFIX}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Not yet deployed")

          echo ""
          echo "=== Deployment Summary ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image Tag**: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Batch Image Tag**: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Domain**: $CF_DOMAIN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Verify the application is accessible via CloudFront" >> $GITHUB_STEP_SUMMARY
          echo "- Test Batch job submission manually via AWS Console" >> $GITHUB_STEP_SUMMARY
