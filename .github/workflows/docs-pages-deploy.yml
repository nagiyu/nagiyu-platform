name: Deploy - docs サイト (GitHub Pages)

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.node-version'
      - '.github/workflows/docs-pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ行う。進行中の公開は、途中で打ち切ると壊れた状態になりうるため止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest

    # 検査と同じ実行環境でビルドするため、共通イメージの上で動かす
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2

    # コンテナのジョブでは run の既定のシェルが sh になり、bash の構文が通らない
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # setup-node の cache: 'npm' を使わないため、npm のキャッシュは自前で続ける。
      # キャッシュの場所は環境で変わるため、npm に聞く
      - name: Get npm cache directory
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      # キーは setup-node の action と同じ形にして、ロックファイルが同じなら共有する
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('./package-lock.json') }}

      # テストやビルドの道具 (jest など) はルートにあるため、ルートと docs-site だけを入れる
      - name: 依存をインストール
        run: npm ci --workspace=docs-site --include-workspace-root

      - name: サイトをビルド
        run: npm run build -w docs-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest

    # ビルドと同じイメージの上で動かし、ランナーの環境に左右されないようにする
    container:
      image: ghcr.io/nagiyu/nagiyu-platform/ci:base-v2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
