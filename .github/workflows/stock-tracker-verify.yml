name: Stock Tracker - Verification

env:
  SERVICE_ID: stock-tracker
  SERVICE_DISPLAY_NAME: Stock Tracker

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/stock-tracker/**'
      - 'libs/**'
      - 'infra/stock-tracker/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stock-tracker-verify.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Web Build Verification
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Web application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/stock-tracker-web'
          shared-workspaces: '@nagiyu/stock-tracker-core'

  build-core:
    name: Core Build Verification
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build Core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

  build-batch:
    name: Batch Build Verification
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Build Batch application
        run: npm run build --workspace @nagiyu/stock-tracker-batch

  build-infra:
    name: Infrastructure Build Verification
    runs-on: ubuntu-latest
    needs: [synth-infra]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-stock-tracker

  docker-build-web:
    name: Docker Build Verification (Web)
    runs-on: ubuntu-latest
    needs: [build-web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/stock-tracker/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/stock-tracker/web/Dockerfile
          image-tag: stock-tracker-web-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  docker-build-batch:
    name: Docker Build Verification (Batch)
    runs-on: ubuntu-latest
    needs: [build-batch]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/stock-tracker/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/stock-tracker/batch/Dockerfile
          image-tag: stock-tracker-batch-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  test-web:
    name: Run Web Unit Tests
    runs-on: ubuntu-latest
    needs: [build-web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Run Web tests
        run: npm run test --workspace @nagiyu/stock-tracker-web

  test-core:
    name: Run Core Unit Tests
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Run Core tests
        run: npm run test --workspace @nagiyu/stock-tracker-core

  contract-test:
    name: Run Contract Tests (DynamoDB Local)
    runs-on: ubuntu-latest
    needs: [build-core]

    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run contract tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm run test:contract --workspace @nagiyu/stock-tracker-core

  test-batch:
    name: Run Batch Unit Tests
    runs-on: ubuntu-latest
    needs: [build-batch]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Run Batch tests
        run: npm run test --workspace @nagiyu/stock-tracker-batch

  coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    needs: [build-core]
    if: github.base_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Run Core tests with coverage
        run: npm run test:coverage --workspace @nagiyu/stock-tracker-core

  e2e-test-web-chromium-mobile:
    name: Run E2E Tests Web (chromium-mobile)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [build-web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Build web application
        run: npm run build --workspace @nagiyu/stock-tracker-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./services/stock-tracker/web

      - name: Run Playwright tests (chromium-mobile)
        env:
          CI: true
          PROJECT: chromium-mobile
        run: |
          npm run test:e2e --workspace @nagiyu/stock-tracker-web
          if [ $? -ne 0 ]; then
            echo "E2E tests failed"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-chromium-mobile
          path: services/stock-tracker/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-chromium-mobile
          path: services/stock-tracker/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/stock-tracker/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/stock-tracker/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/chromium-mobile/" \
            --delete --no-progress

  e2e-test-web-chromium-desktop:
    name: Run E2E Tests Web (chromium-desktop)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [build-web]
    if: github.base_ref == 'develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Build web application
        run: npm run build --workspace @nagiyu/stock-tracker-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./services/stock-tracker/web

      - name: Run Playwright tests (chromium-desktop)
        env:
          CI: true
          PROJECT: chromium-desktop
        run: |
          npm run test:e2e --workspace @nagiyu/stock-tracker-web
          if [ $? -ne 0 ]; then
            echo "E2E tests failed"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-chromium-desktop
          path: services/stock-tracker/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-chromium-desktop
          path: services/stock-tracker/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/stock-tracker/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/stock-tracker/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/chromium-desktop/" \
            --delete --no-progress

  e2e-test-web-webkit-mobile:
    name: Run E2E Tests Web (webkit-mobile)
    # Playwright 1.60.0 は Ubuntu 26.04 (ubuntu-latest) に対応しておらず、ブラウザを入れられないため固定する。
    runs-on: ubuntu-24.04
    needs: [build-web]
    if: github.base_ref == 'develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace @nagiyu/stock-tracker-core

      - name: Build web application
        run: npm run build --workspace @nagiyu/stock-tracker-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps webkit
        working-directory: ./services/stock-tracker/web

      - name: Run Playwright tests (webkit-mobile)
        env:
          CI: true
          PROJECT: webkit-mobile
        run: |
          npm run test:e2e --workspace @nagiyu/stock-tracker-web
          if [ $? -ne 0 ]; then
            echo "E2E tests failed"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-playwright-report-full-webkit-mobile
          path: services/stock-tracker/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.SERVICE_ID }}-test-results-full-webkit-mobile
          path: services/stock-tracker/web/test-results/
          retention-days: 30

      - name: Configure AWS credentials for report upload
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload Playwright HTML report to E2E reports
        if: always()
        run: |
          aws s3 sync services/stock-tracker/web/playwright-report/ \
            "s3://${{ vars.E2E_REPORTS_BUCKET || 'nagiyu-e2e-reports' }}/stock-tracker/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/webkit-mobile/" \
            --delete --no-progress

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Run lint on Core
        run: npm run lint --workspace @nagiyu/stock-tracker-core

      - name: Run lint on Batch
        run: npm run lint --workspace @nagiyu/stock-tracker-batch

      - name: Run lint on Web
        run: npm run lint --workspace @nagiyu/stock-tracker-web

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check formatting on Core
        run: npm run format:check --workspace @nagiyu/stock-tracker-core

      - name: Check formatting on Batch
        run: npm run format:check --workspace @nagiyu/stock-tracker-batch

      - name: Check formatting on Web
        run: npm run format:check --workspace @nagiyu/stock-tracker-web

  synth-infra:
    name: Synthesize Infrastructure
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-stock-tracker

      - name: Synthesize CDK stack
        run: npm run synth --workspace=@nagiyu/infra-stock-tracker -- --context env=dev

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        build-web,
        build-core,
        build-batch,
        build-infra,
        docker-build-web,
        docker-build-batch,
        test-web,
        test-core,
        test-batch,
        contract-test,
        coverage,
        e2e-test-web-chromium-mobile,
        e2e-test-web-chromium-desktop,
        e2e-test-web-webkit-mobile,
        lint,
        format-check,
        synth-infra,
      ]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: stock-tracker
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
