name: Reusable Service Verify

# 検査の対象をワークフローごとに手で列挙すると、ワークスペースの追加や検査の追加で漏れが出る。
# ディレクトリからワークスペースを導き、検査を一律にかける。
on:
  workflow_call:
    inputs:
      dirs:
        description: 対象のディレクトリ (空白または改行区切り。例 "services/quick-clip infra/quick-clip")
        required: true
        type: string
      coverage-exclude:
        description: カバレッジ検査から外すワークスペース名 (空白区切り)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  discover:
    name: Discover Workspaces
    runs-on: ubuntu-latest

    outputs:
      workspaces: ${{ steps.list.outputs.workspaces }}
      contract-workspaces: ${{ steps.list.outputs.contract-workspaces }}
      has-contract: ${{ steps.list.outputs.has-contract }}
      prebuild: ${{ steps.list.outputs.prebuild }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # action は npm ci 前に動かすため、依存を入れずに Node だけを用意する
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ディレクトリを渡すと module として読もうとして失敗するため、glob で渡す
      - name: Test workspace listing
        run: node --test '.github/actions/list-service-workspaces/*.test.js'

      - name: List workspaces
        id: list
        uses: ./.github/actions/list-service-workspaces
        with:
          dirs: ${{ inputs.dirs }}
          coverage-exclude: ${{ inputs.coverage-exclude }}

  check:
    name: Check (${{ matrix.workspace.name }})
    runs-on: ubuntu-latest
    needs: [discover]

    strategy:
      # 1 つの失敗で他のワークスペースの結果が見えなくならないようにする
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}

    env:
      # inputs や matrix の値を run に直接埋め込むとインジェクションになるため、env 経由で渡す
      WORKSPACE_NAME: ${{ matrix.workspace.name }}
      PREBUILD: ${{ needs.discover.outputs.prebuild }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      # ビルド後の dist/ を prettier が拾って落ちるため、ビルドより前に流す。
      # lint が落ちても後続を流し、1 回の run で全部の結果が見えるようにする
      - name: Run lint
        if: matrix.workspace.lint
        run: npm run lint --workspace="$WORKSPACE_NAME"

      - name: Check formatting
        if: (success() || failure()) && matrix.workspace.format
        run: npm run format:check --workspace="$WORKSPACE_NAME"

      # web や batch は core のビルド成果物を参照するため、テストの前に作る
      - name: Build dependencies
        id: build
        if: (success() || failure()) && (matrix.workspace.test || matrix.workspace.coverage)
        run: |
          npm run build:libs
          for workspace in $PREBUILD; do
            npm run build --workspace="$workspace"
          done

      # カバレッジは develop 向けの PR だけで検査する (integration 向けは Fast にとどめる)。
      # ビルドが落ちたときにテストまで走らせると、原因ではない失敗が増えるため止める
      - name: Run tests with coverage
        if: >-
          (success() || failure()) && steps.build.outcome != 'failure'
          && github.base_ref == 'develop' && matrix.workspace.coverage
        run: npm run test:coverage --workspace="$WORKSPACE_NAME"

      - name: Run tests
        if: >-
          (success() || failure()) && steps.build.outcome != 'failure'
          && matrix.workspace.test
          && !(github.base_ref == 'develop' && matrix.workspace.coverage)
        run: npm run test --workspace="$WORKSPACE_NAME"

  # ジョブ名に matrix の式を書くと、契約テストが無くてスキップしたときに式がそのまま表示される。
  # 名前は固定にし、matrix にワークスペース名だけを渡して、GitHub に括弧付きで付けさせる
  contract:
    name: Contract Test
    runs-on: ubuntu-latest
    needs: [discover]
    if: needs.discover.outputs.has-contract == 'true'

    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.contract-workspaces) }}

    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    env:
      WORKSPACE_NAME: ${{ matrix.workspace }}
      PREBUILD: ${{ needs.discover.outputs.prebuild }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build dependencies
        run: |
          npm run build:libs
          for workspace in $PREBUILD; do
            npm run build --workspace="$workspace"
          done

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run contract tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm run test:contract --workspace="$WORKSPACE_NAME"
