name: Dev Sync - Verification

env:
  SERVICE_ID: dev-sync
  SERVICE_DISPLAY_NAME: Dev Sync

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/dev-sync/**'
      - 'infra/dev-sync/**'
      - 'libs/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dev-sync-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-infra-verify.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: services/dev-sync infra/dev-sync
    permissions:
      contents: read

  infra-verify:
    name: Infra Verify
    uses: ./.github/workflows/reusable-infra-verify.yml
    with:
      dirs: infra/dev-sync
    permissions:
      contents: read

  docker-build:
    name: Docker Build Verification (Batch)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/dev-sync/batch/Dockerfile
          image-tag: dev-sync-batch-verify-full-test

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, docker-build, infra-verify]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
