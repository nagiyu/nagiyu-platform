name: QuickClip - Verification

env:
  SERVICE_ID: quick-clip
  SERVICE_DISPLAY_NAME: QuickClip

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/quick-clip/**'
      - 'infra/quick-clip/**'
      - 'libs/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quick-clip-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: services/quick-clip infra/quick-clip
      # lambda-clip は分岐カバレッジが閾値の 80% を割っているため、テストを足すまでカバレッジ検査から外す。
      # 通常のテストと lint は外さない。
      coverage-exclude: '@nagiyu/quick-clip-lambda-clip'
    permissions:
      contents: read

  build-core:
    name: Build Core Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/quick-clip-core

  build-web:
    name: Build Web Package
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build web application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/quick-clip-web'
          shared-workspaces: '@nagiyu/quick-clip-core'

  build-batch:
    name: Build Batch Package
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/quick-clip-core

      - name: Build batch package
        run: npm run build --workspace=@nagiyu/quick-clip-batch

  build-lambda-clip:
    name: Build Lambda Clip Package
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/quick-clip-core

      - name: Build lambda clip package
        run: npm run build --workspace=@nagiyu/quick-clip-lambda-clip

  build-lambda-zip:
    name: Build Lambda Zip Package
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/quick-clip-core

      - name: Build lambda zip package
        run: npm run build --workspace=@nagiyu/quick-clip-lambda-zip

  build-infra:
    name: Build Infrastructure Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build infrastructure package
        run: npm run build --workspace=@nagiyu/infra-quick-clip

  docker-build-web:
    name: Docker Build Web
    runs-on: ubuntu-latest
    needs: [build-web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/quick-clip/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Web Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/quick-clip/web/Dockerfile
          image-tag: quick-clip-web-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  docker-build-batch:
    name: Docker Build Batch
    runs-on: ubuntu-latest
    needs: [build-batch]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/quick-clip/batch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Batch Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/quick-clip/batch/Dockerfile
          image-tag: quick-clip-batch-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  docker-build-lambda-clip:
    name: Docker Build Lambda Clip
    runs-on: ubuntu-latest
    needs: [build-lambda-clip]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/quick-clip/lambda/clip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda Clip Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/quick-clip/lambda/clip/Dockerfile
          image-tag: quick-clip-lambda-clip-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  docker-build-lambda-zip:
    name: Docker Build Lambda Zip
    runs-on: ubuntu-latest
    needs: [build-lambda-zip]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/quick-clip/lambda/zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda Zip Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/quick-clip/lambda/zip/Dockerfile
          image-tag: quick-clip-lambda-zip-verify-full-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  e2e:
    name: E2E
    needs: [build-web]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/quick-clip-web'
      shared-workspaces: '@nagiyu/quick-clip-core'
      web-dir: services/quick-clip/web
      report-key: quick-clip
      full: ${{ github.base_ref == 'develop' }}
    permissions:
      id-token: write
      contents: read

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        verify,
        build-core,
        build-web,
        build-batch,
        build-lambda-clip,
        build-lambda-zip,
        build-infra,
        docker-build-web,
        docker-build-batch,
        docker-build-lambda-clip,
        docker-build-lambda-zip,
        e2e,
      ]
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: quick-clip
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
