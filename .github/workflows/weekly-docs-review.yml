name: Weekly Documentation Review

on:
  workflow_dispatch: # 手動実行も可能

permissions:
  issues: write
  contents: read

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check existing open weekly-review issue
        id: duplicate_check
        uses: ./.github/actions/find-open-issue
        with:
          label: weekly-review

      # 年・週番号・日付は JST で決める (UTC のままだと JST の日付とずれる時間帯がある)
      - name: Get current week info
        id: week_info
        if: steps.duplicate_check.outputs.should_create == 'true'
        run: |
          YEAR=$(TZ=Asia/Tokyo date +%Y)
          WEEK=$(TZ=Asia/Tokyo date +%U)
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "title=[Docs Review] ${YEAR}年第${WEEK}週 ドキュメントレビュー (${DATE})" >> "$GITHUB_OUTPUT"

      - name: Calculate next review date
        id: next_review
        if: steps.duplicate_check.outputs.should_create == 'true'
        run: |
          # 次週月曜日を計算
          NEXT_MONDAY=$(TZ=Asia/Tokyo date -d "next monday" +%Y-%m-%d)
          echo "next_date=$NEXT_MONDAY" >> "$GITHUB_OUTPUT"

      - name: Find previous review issue
        id: prev_issue
        if: steps.duplicate_check.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 過去の Docs Review Issue を検索
          PREV_ISSUE=$(gh issue list \
            --label "weekly-review" \
            --state all \
            --limit 1 \
            --json number \
            --jq '.[0].number // ""')

          if [ -n "$PREV_ISSUE" ]; then
            echo "prev_issue_number=#$PREV_ISSUE" >> "$GITHUB_OUTPUT"
          else
            echo "prev_issue_number=なし（初回レビュー）" >> "$GITHUB_OUTPUT"
          fi

      - name: Count updated docs in last week
        id: metrics
        if: steps.duplicate_check.outputs.should_create == 'true'
        run: |
          # 過去1週間で更新された .md ファイル数
          UPDATED_DOCS=$(git log --since="1 week ago" --name-only --pretty=format: -- docs/ .github/ | grep "\.md$" | sort -u | wc -l)
          echo "updated_docs=$UPDATED_DOCS" >> "$GITHUB_OUTPUT"

      - name: Detect policy changes in development docs
        id: policy_changes
        if: steps.duplicate_check.outputs.should_create == 'true'
        run: |
          # 過去1週間の docs/development/ の変更を検出
          POLICY_CHANGES=$(git log --since="1 week ago" --oneline --no-merges -- docs/development/ | head -10)

          if [ -n "$POLICY_CHANGES" ]; then
            # コミット件名が区切りと一致して出力が壊れないよう、区切りは毎回ランダムにする
            DELIMITER="EOF_$(openssl rand -hex 8)"
            {
              echo "policy_changes<<$DELIMITER"
              echo "$POLICY_CHANGES"
              echo "$DELIMITER"
            } >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "policy_changes=変更なし" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare issue body from template
        id: issue_body
        if: steps.duplicate_check.outputs.should_create == 'true'
        env:
          UPDATED_DOCS: ${{ steps.metrics.outputs.updated_docs }}
          PREV_ISSUE: ${{ steps.prev_issue.outputs.prev_issue_number }}
          NEXT_DATE: ${{ steps.next_review.outputs.next_date }}
          HAS_POLICY_CHANGES: ${{ steps.policy_changes.outputs.has_changes }}
          POLICY_CHANGES: ${{ steps.policy_changes.outputs.policy_changes }}
        run: |
          .github/workflows/scripts/prepare-review-issue.sh > "${RUNNER_TEMP}/issue_body.md"
          echo "body_file=${RUNNER_TEMP}/issue_body.md" >> "$GITHUB_OUTPUT"

      - name: Create weekly review issue
        if: steps.duplicate_check.outputs.should_create == 'true'
        uses: ./.github/actions/create-issue
        with:
          title: ${{ steps.week_info.outputs.title }}
          labels: documentation,weekly-review
          body-file: ${{ steps.issue_body.outputs.body_file }}
          summary-heading: '✅ 週次ドキュメントレビュー Issue を作成しました'
          summary-extra: |
            **次回レビュー予定**: ${{ steps.next_review.outputs.next_date }}
            **過去1週間の更新ドキュメント数**: ${{ steps.metrics.outputs.updated_docs }} ファイル

            ${{ steps.policy_changes.outputs.has_changes == 'true' && '⚠️ **開発方針ドキュメントに変更が検出されました**' || '📝 開発方針ドキュメントに変更なし' }}
            ${{ steps.policy_changes.outputs.has_changes == 'true' && 'Priority 4 の「14. 方針変更の追従漏れチェック」を必ず実施してください。' || '' }}
