name: Share Together - Verification

env:
  SERVICE_ID: share-together
  SERVICE_DISPLAY_NAME: Share Together

on:
  pull_request:
    branches:
      - develop
      - integration/**
    paths:
      - 'services/share-together/**'
      - 'infra/share-together/**'
      - 'libs/**'
      - 'infra/common/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/share-together-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Run ESLint on core
        run: npm run lint --workspace=@nagiyu/share-together-core

      - name: Run ESLint on web
        run: npm run lint --workspace=@nagiyu/share-together-web

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check core formatting
        run: npm run format:check --workspace=@nagiyu/share-together-core

      - name: Check web formatting
        run: npm run format:check --workspace=@nagiyu/share-together-web

  build-core:
    name: Build Core Package
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/share-together-core

  build-web:
    name: Build Web Package
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build web application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/share-together-web'
          shared-workspaces: '@nagiyu/share-together-core'

  docker-build:
    name: Docker Build Web
    runs-on: ubuntu-latest
    needs: [build-web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/share-together/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build web Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/share-together/web/Dockerfile
          image-tag: share-together-web-verify-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

  test-core:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    needs: [build-core]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/share-together-core

      - name: Run core tests
        run: npm run test --workspace=@nagiyu/share-together-core

  contract-test:
    name: Run Contract Tests (DynamoDB Local)
    runs-on: ubuntu-latest
    needs: [build-core]

    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/share-together-core

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run contract tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm run test:contract --workspace=@nagiyu/share-together-core

  test-web:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    needs: [build-web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/share-together-core

      - name: Run web unit tests
        run: npm run test --workspace=@nagiyu/share-together-web

  coverage:
    name: Coverage Check (80% threshold)
    runs-on: ubuntu-latest
    needs: [build-core]
    if: github.base_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build core package
        run: npm run build --workspace=@nagiyu/share-together-core

      - name: Run coverage check
        run: npm run test:coverage --workspace=@nagiyu/share-together-core

  e2e:
    name: E2E
    needs: [build-web]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/share-together-web'
      shared-workspaces: '@nagiyu/share-together-core'
      web-dir: services/share-together/web
      report-key: share-together
      full: ${{ github.base_ref == 'develop' }}
      env: |
        SKIP_AUTH_CHECK=true
        AUTH_SECRET=test-secret-for-e2e
        NEXTAUTH_SECRET=test-secret-for-e2e
    permissions:
      id-token: write
      contents: read

  synth-infra:
    name: Synthesize Infrastructure
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build infrastructure package
        run: npm run build --workspace=@nagiyu/infra

      - name: Synthesize CDK stack
        run: npm run synth --workspace=@nagiyu/infra -- --context env=dev

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        lint,
        format-check,
        build-core,
        build-web,
        docker-build,
        test-core,
        test-web,
        contract-test,
        coverage,
        e2e,
        synth-infra,
      ]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: share-together
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
