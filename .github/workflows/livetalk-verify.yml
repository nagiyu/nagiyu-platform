name: LiveTalk - Verification

env:
  SERVICE_ID: livetalk
  SERVICE_DISPLAY_NAME: LiveTalk

on:
  pull_request:
    branches:
      - integration/**
      - develop
    paths:
      - 'services/livetalk/**'
      - 'infra/livetalk/**'
      - 'infra/common/**'
      - 'libs/**'
      - 'infra/tsconfig.json'
      - 'configs/**'
      - '.github/actions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/livetalk-verify.yml'
      - '.github/workflows/reusable-e2e.yml'

permissions:
  contents: read

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Run ESLint on core
        run: npm run lint --workspace=@nagiyu/livetalk-core

      - name: Run ESLint on web
        run: npm run lint --workspace=@nagiyu/livetalk-web

      - name: Run ESLint on batch
        run: npm run lint --workspace=@nagiyu/livetalk-batch

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Check core formatting
        run: npm run format:check --workspace=@nagiyu/livetalk-core

      - name: Check web formatting
        run: npm run format:check --workspace=@nagiyu/livetalk-web

      - name: Check batch formatting
        run: npm run format:check --workspace=@nagiyu/livetalk-batch

  synth-infra:
    name: Synthesize Infrastructure
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build common infrastructure package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build CDK TypeScript
        run: npm run build --workspace=@nagiyu/infra-livetalk

      - name: Run infra-livetalk unit tests
        run: npm run test --workspace=@nagiyu/infra-livetalk

      - name: Synthesize CDK stacks (dev)
        env:
          ENVIRONMENT: dev
          CDK_DEFAULT_ACCOUNT: '000000000000'
        run: |
          npm run synth --workspace=@nagiyu/infra-livetalk -- \
            NagiyuLiveTalkEcrDev \
            NagiyuLiveTalkBatchEcrDev \
            NagiyuLiveTalkAlbDev \
            NagiyuLiveTalkServiceDev \
            NagiyuLiveTalkBatchDev \
            NagiyuLiveTalkCloudFrontDev

      - name: Synthesize CDK stacks (prod)
        env:
          ENVIRONMENT: prod
          CDK_DEFAULT_ACCOUNT: '000000000000'
        run: |
          npm run synth --workspace=@nagiyu/infra-livetalk -- \
            NagiyuLiveTalkEcrProd \
            NagiyuLiveTalkBatchEcrProd \
            NagiyuLiveTalkAlbProd \
            NagiyuLiveTalkServiceProd \
            NagiyuLiveTalkBatchProd \
            NagiyuLiveTalkCloudFrontProd

  build:
    name: Next.js Build Verification
    runs-on: ubuntu-latest
    needs: [lint, format-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Next.js application
        uses: ./.github/actions/build-web-app
        with:
          workspace: '@nagiyu/livetalk-web'
          shared-workspaces: '@nagiyu/livetalk-core'

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        working-directory: ./services/livetalk/web
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "app-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/livetalk/web/Dockerfile
          image-tag: livetalk-verify-test
          build-args: APP_VERSION=${{ steps.get-version.outputs.app-version }}

      - name: Build Batch Docker image
        uses: ./.github/actions/build-docker-image
        with:
          dockerfile: services/livetalk/batch/Dockerfile
          image-tag: livetalk-batch-verify-test

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: |
          npm run build:libs
          npm run build --workspace @nagiyu/livetalk-core

      - name: Run core unit tests
        run: npm run test --workspace @nagiyu/livetalk-core

      - name: Run web unit tests
        run: npm run test --workspace @nagiyu/livetalk-web

      - name: Run batch unit tests
        run: npm run test --workspace @nagiyu/livetalk-batch

  contract-test:
    name: Run Contract Tests (DynamoDB Local)
    runs-on: ubuntu-latest
    needs: [build]

    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: npm run build:libs

      - name: Build infra-common package
        run: npm run build --workspace=@nagiyu/infra-common

      - name: Build core package
        run: npm run build --workspace @nagiyu/livetalk-core

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run contract tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm run test:contract --workspace @nagiyu/livetalk-core

  coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    needs: [unit-test]
    if: github.base_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'
          cache-dependency-path: './package-lock.json'

      - name: Build shared libraries
        run: |
          npm run build:libs
          npm run build --workspace @nagiyu/livetalk-core

      - name: Run core tests with coverage
        run: npm run test:coverage --workspace @nagiyu/livetalk-core

      - name: Run web tests with coverage
        run: npm run test:coverage --workspace @nagiyu/livetalk-web

  e2e:
    name: E2E
    needs: [unit-test]
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: '@nagiyu/livetalk-web'
      shared-workspaces: '@nagiyu/livetalk-core'
      web-dir: services/livetalk/web
      report-key: livetalk
      full: ${{ github.base_ref == 'develop' }}
    permissions:
      id-token: write
      contents: read

  report:
    name: Report Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        lint,
        format-check,
        synth-infra,
        build,
        docker-build,
        unit-test,
        contract-test,
        coverage,
        e2e,
      ]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Report results to PR
        uses: ./.github/actions/report-verify-results
        with:
          display-name: ${{ env.SERVICE_DISPLAY_NAME }}
          fast-full: 'true'
          e2e-report-key: livetalk
          reports-base-url: ${{ vars.E2E_REPORTS_BASE_URL || 'https://reports.nagiyu.com' }}
