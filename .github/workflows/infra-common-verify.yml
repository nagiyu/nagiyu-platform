name: Infra Common - Verification

on:
  pull_request:
    branches:
      - develop
      - integration/**
    paths:
      - 'infra/common/**'
      - 'configs/**'
      - '.github/actions/**'
      - '.node-version'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/infra-common-verify.yml'
      - '.github/workflows/reusable-service-verify.yml'
      - '.github/workflows/reusable-infra-verify.yml'

# 同じ PR (push 起点ではブランチ) の古いコミットに対する検証は不要なため、新しい run が来たら打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/reusable-service-verify.yml
    with:
      dirs: infra/common
    permissions:
      contents: read

  infra-verify:
    name: Infra Verify
    uses: ./.github/workflows/reusable-infra-verify.yml
    with:
      dirs: infra/common
    permissions:
      contents: read
